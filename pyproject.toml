[project]
name = "standard-benchmark"
version = "1.0.0"
description = "Open-source framework for evaluating and comparing search APIs (Linkup, Exa, Tavily, Perplexity) using configurable datasets and multiple scoring systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Linkup", email = "support@linkup.so"},
]

dependencies = [
    "typer>=0.9.0",
    "shellingham>=1.5.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "langdetect>=1.0.9",
    "scikit-learn>=1.3.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "rich>=13.6.0",
    "tqdm>=4.66.0",
    "linkup-sdk>=0.1.0",
    "exa-py>=1.0.0",
    "tavily-python>=0.3.0",
    "perplexityai>=0.1.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    "statsmodels>=0.14.5",
    "ragas>=0.1.0",
    "langchain-openai>=0.1.0",
    "judges[litellm]>=0.1.0",
    "litellm>=1.0.0",
]

[project.scripts]
standard-benchmark = "standard_benchmark.cli.main:app"

[project.urls]
Homepage = "https://github.com/LinkupPlatform/standard-benchmark"
Repository = "https://github.com/LinkupPlatform/standard-benchmark"
Issues = "https://github.com/LinkupPlatform/standard-benchmark/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standard_benchmark"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "seaborn",
    "pandas",
    "plotly.*",
    "sklearn.*",
    "tavily",
    "perplexity",
    "linkup",
    "exa_py",
    "judges.*",
    "bert_score",
    "rouge_score.*",
    "sentence_transformers",
    "yaml",
    "spacy",
    "streamlit",
    "ragas.*",
    "langchain_openai",
]
ignore_missing_imports = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
exclude-newer = "2 weeks" # Reduce risks of supply chain attacks
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" } # HACK: this is a temporary workaround and can be removed 2 weeks after this date
required-version = ">=0.13.5,<0.14.0"

[dependency-groups]
dev = [
    "black>=23.9.0",
    "ruff>=0.0.292",
    "mypy>=1.5.0",
    "ipython>=8.15.0",
]
